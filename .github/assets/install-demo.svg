<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 448" width="980" height="448" role="img" aria-label="Installing an OrveX VPS node with one command">
  <title>OrveX installer</title>
  <defs>
    <clipPath id="typing"><rect class="typer" x="44" y="60" height="26" width="0"/></clipPath>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151229"/><stop offset="1" stop-color="#0d0b1c"/></linearGradient>
  </defs>
  <style>
    .typer { animation: type 16.0s steps(98, end) infinite; }
    @keyframes type { 0% { width: 0; } 20.00%, 94% { width: 849px; } 100% { width: 0; } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
        .l1 { animation: l1 16.0s infinite; } @keyframes l1 { 0%, 21.56% { opacity: 0; } 23.06%, 94% { opacity: 1; } 100% { opacity: 0; } }
    .l2 { animation: l2 16.0s infinite; } @keyframes l2 { 0%, 25.00% { opacity: 0; } 26.50%, 94% { opacity: 1; } 100% { opacity: 0; } }
    .l3 { animation: l3 16.0s infinite; } @keyframes l3 { 0%, 28.44% { opacity: 0; } 29.94%, 94% { opacity: 1; } 100% { opacity: 0; } }
    .l4 { animation: l4 16.0s infinite; } @keyframes l4 { 0%, 31.88% { opacity: 0; } 33.38%, 94% { opacity: 1; } 100% { opacity: 0; } }
    .l5 { animation: l5 16.0s infinite; } @keyframes l5 { 0%, 35.31% { opacity: 0; } 36.81%, 94% { opacity: 1; } 100% { opacity: 0; } }
    .l6 { animation: l6 16.0s infinite; } @keyframes l6 { 0%, 38.75% { opacity: 0; } 40.25%, 94% { opacity: 1; } 100% { opacity: 0; } }
    .l7 { animation: l7 16.0s infinite; } @keyframes l7 { 0%, 42.19% { opacity: 0; } 43.69%, 94% { opacity: 1; } 100% { opacity: 0; } }
    .l8 { animation: l8 16.0s infinite; } @keyframes l8 { 0%, 45.63% { opacity: 0; } 47.13%, 94% { opacity: 1; } 100% { opacity: 0; } }
    .l9 { animation: l9 16.0s infinite; } @keyframes l9 { 0%, 49.06% { opacity: 0; } 50.56%, 94% { opacity: 1; } 100% { opacity: 0; } }
    .l10 { animation: l10 16.0s infinite; } @keyframes l10 { 0%, 52.50% { opacity: 0; } 54.00%, 94% { opacity: 1; } 100% { opacity: 0; } }
    .l11 { animation: l11 16.0s infinite; } @keyframes l11 { 0%, 55.94% { opacity: 0; } 57.44%, 94% { opacity: 1; } 100% { opacity: 0; } }
    .l12 { animation: l12 16.0s infinite; } @keyframes l12 { 0%, 59.38% { opacity: 0; } 60.88%, 94% { opacity: 1; } 100% { opacity: 0; } }
    .l13 { animation: l13 16.0s infinite; } @keyframes l13 { 0%, 62.81% { opacity: 0; } 64.31%, 94% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .typer { animation: none; width: 849px; } [class*=" l"] { animation: none; opacity: 1; } }
  </style>
  <rect x="1" y="1" width="978" height="446" rx="16" fill="url(#win)" stroke="#7c3aed" stroke-opacity="0.45"/>
  <circle cx="28" cy="26" r="7" fill="#f87171"/><circle cx="52" cy="26" r="7" fill="#fbbf24"/><circle cx="76" cy="26" r="7" fill="#34d399"/>
  <text x="490" y="31" text-anchor="middle" xml:space="preserve" font-family="JetBrains Mono, Fira Code, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" class="mono" fill="#94a3b8">root@node1: ~</text>
  <line x1="1" y1="48" x2="979" y2="48" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="28" y="78" xml:space="preserve" font-family="JetBrains Mono, Fira Code, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" class="mono" fill="#a78bfa" font-weight="700">$</text>
  <text x="44" y="78" xml:space="preserve" font-family="JetBrains Mono, Fira Code, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" class="mono" fill="#e2e8f0" clip-path="url(#typing)">curl -fsSL https://raw.githubusercontent.com/tanmay712/FeatherPanel/develop/install.sh | sudo bash</text>
  <text x="28" y="102" xml:space="preserve" font-family="JetBrains Mono, Fira Code, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" class="mono l1" fill="#c084fc" font-weight="400">  ◖ OrveX Panel · game servers · billing · VPS hosting</text>
  <text x="28" y="126" xml:space="preserve" font-family="JetBrains Mono, Fira Code, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" class="mono l2" fill="#cbd5e1" font-weight="400"></text>
  <text x="28" y="150" xml:space="preserve" font-family="JetBrains Mono, Fira Code, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" class="mono l3" fill="#f8fafc" font-weight="700">  What do you want to do?</text>
  <text x="28" y="174" xml:space="preserve" font-family="JetBrains Mono, Fira Code, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" class="mono l4" fill="#cbd5e1" font-weight="400">    1) Install OrveX Panel</text>
  <text x="28" y="198" xml:space="preserve" font-family="JetBrains Mono, Fira Code, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" class="mono l5" fill="#f0abfc" font-weight="400">    2) Install OrveX VPS Node   (KVM + LXC · dedicated &amp; shared IPv4)</text>
  <text x="28" y="222" xml:space="preserve" font-family="JetBrains Mono, Fira Code, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" class="mono l6" fill="#cbd5e1" font-weight="400">    3) Update OrveX Panel       5) Status</text>
  <text x="28" y="246" xml:space="preserve" font-family="JetBrains Mono, Fira Code, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" class="mono l7" fill="#93c5fd" font-weight="400">  Choose an option [1]: 2</text>
  <text x="28" y="270" xml:space="preserve" font-family="JetBrains Mono, Fira Code, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" class="mono l8" fill="#a78bfa" font-weight="700">==&gt; Incus (LXC + KVM engine)</text>
  <text x="28" y="294" xml:space="preserve" font-family="JetBrains Mono, Fira Code, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" class="mono l9" fill="#86efac" font-weight="400">  ✓ Incus installed · storage pool &#x27;default&#x27; (btrfs, 300GiB)</text>
  <text x="28" y="318" xml:space="preserve" font-family="JetBrains Mono, Fira Code, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" class="mono l10" fill="#86efac" font-weight="400">  ✓ Shared IPv4 bridge orvexnat0 (10.77.0.1/24, NAT)</text>
  <text x="28" y="342" xml:space="preserve" font-family="JetBrains Mono, Fira Code, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" class="mono l11" fill="#a78bfa" font-weight="700">==&gt; OrveX node agent</text>
  <text x="28" y="366" xml:space="preserve" font-family="JetBrains Mono, Fira Code, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" class="mono l12" fill="#86efac" font-weight="400">  ✓ Agent running on port 8006 · templates cached</text>
  <text x="28" y="390" xml:space="preserve" font-family="JetBrains Mono, Fira Code, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" class="mono l13" fill="#f8fafc" font-weight="700">  ✓ Connected to OrveX Panel · 13 templates · 253 shared IPv4s</text>
  <rect class="cursor" x="28" y="402" width="9" height="17" fill="#c4b5fd"/>
</svg>
